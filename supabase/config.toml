# A unique identifier for your project
project_id = "crm-saas"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3001"

# JWT is checked inside the function. Gateway verify_jwt must be off so the
# browser OPTIONS preflight (no Authorization header) can return 200 + CORS.
[functions.create-user]
verify_jwt = false
[functions.ask-admin-assistant]
verify_jwt = false

# Public checkout. The function creates a pending purchase with the service role.
# The Stripe webhook has no Supabase JWT; the signature check is the auth.
[functions.create-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
